name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  run_tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          init-shell: bash

      - name: Unit tests
        run: |
          python -m unittest test_my_utils

      - name: Functional tests
        run: |
          ./test_print_fires.sh

      - name: Style check
        run: pycodestyle $(git ls-files "*.py")

    